name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur les machines ubuntu-latest (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires (module core)
        run: ./gradlew :core:test --stacktrace

      - name: Compilation APK debug
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Lint Android
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
